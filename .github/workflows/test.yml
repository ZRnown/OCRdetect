name: OCR Service CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.8, 3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install test dependencies
      run: |
        pip install requests

    - name: Run OCR service test
      run: |
        # 启动服务（后台运行）
        python main.py &
        # 等待服务启动
        sleep 5
        # 测试API
        python -c "
        import requests
        import time
        import base64

        # 等待服务完全启动
        time.sleep(3)

        try:
            # 创建测试图像
            from PIL import Image, ImageDraw, ImageFont
            import io

            # 创建一个简单的测试图像
            img = Image.new('RGB', (100, 40), color='white')
            draw = ImageDraw.Draw(img)
            draw.text((10, 10), 'TEST', fill='black')

            # 转换为base64
            buffer = io.BytesIO()
            img.save(buffer, format='PNG')
            img_base64 = base64.b64encode(buffer.getvalue()).decode()

            # 测试API
            response = requests.post('http://127.0.0.1:5000/ocr',
                                   json={'image': img_base64},
                                   timeout=10)
            result = response.json()
            print(f'✅ API测试成功: {result}')

        except Exception as e:
            print(f'❌ API测试失败: {e}')
            exit(1)
        "

    - name: Test image preprocessing
      run: |
        python -c "
        import cv2
        import numpy as np
        from main import preprocess_image

        # 创建测试图像
        img = np.ones((50, 100, 3), dtype=np.uint8) * 255
        cv2.putText(img, 'ABC123', (10, 30), cv2.FONT_HERSHEY_SIMPLEX, 1, (0,0,0), 2)

        # 转换为字节
        success, encoded = cv2.imencode('.png', img)
        img_bytes = encoded.tobytes()

        # 测试预处理
        processed = preprocess_image(img_bytes)
        print('✅ 图像预处理测试成功' if processed else '❌ 图像预处理测试失败')
        "

  build-windows:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows executable
      run: |
        python build_exe.py

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: ocr-service-windows
        path: dist/OCR_Service.exe

  build-linux:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Linux executable
      run: |
        python build_exe.py

    - name: Upload Linux executable
      uses: actions/upload-artifact@v4
      with:
        name: ocr-service-linux
        path: dist/OCR_Service

  build-macos:
    runs-on: macos-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build macOS executable
      run: |
        python build_exe.py

    - name: Upload macOS executable
      uses: actions/upload-artifact@v4
      with:
        name: ocr-service-macos
        path: dist/OCR_Service
