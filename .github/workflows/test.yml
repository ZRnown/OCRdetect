name: OCR Service CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0

    - name: Verify file content
      run: |
        echo "Checking test_basic.py content:"
        head -10 test_basic.py

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install test dependencies
      run: |
        pip install requests

    - name: Run basic tests
      run: |
        python test_basic.py

    - name: Test OCR service startup
      run: |
        # Test if service can start normally (run for 5 seconds then stop)
        python -c "
        import subprocess
        import time
        import signal
        import os

        try:
            # Start service process
            proc = subprocess.Popen(['python', 'main.py'])

            # Wait 5 seconds for service to start
            time.sleep(5)

            # Terminate process
            if os.name == 'nt':  # Windows
                proc.terminate()
            else:  # Unix-like
                os.kill(proc.pid, signal.SIGTERM)

            # Wait for process to end
            proc.wait(timeout=5)
            print('Service startup test successful')

        except Exception as e:
            print(f'Service startup test failed: {e}')
            if 'proc' in locals():
                proc.kill()
        "

  build:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows executable
      run: |
        python build_exe.py

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: ocr-service-windows
        path: dist/OCR_Service.exe
